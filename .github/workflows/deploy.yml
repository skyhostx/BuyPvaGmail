name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and git commits to gh-pages branch
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install --include=dev --no-audit --no-fund

      - name: Build project
        run: npm run build

      - name: Configure .nojekyll and CNAME in build output
        run: |
          touch dist/.nojekyll
          if [ -f "CNAME" ]; then
            cp CNAME dist/CNAME
          fi
          if [ -f "public/CNAME" ]; then
            cp public/CNAME dist/CNAME
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # Also deploy to gh-pages branch so deployment succeeds if repository Pages source is set to "Deploy from a branch"
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ !cancelled() }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: buypvagmail.com
          keep_files: false

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

